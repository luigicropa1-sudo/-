<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salvaspesa</title>
  <meta name="description" content="La spesa buona che sta per scadere, fino al 70% in meno. Consegna a casa in pochi giorni.">
  <meta name="theme-color" content="#0F8A5F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Salvaspesa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- i caratteri si caricano senza fermare la pagina; il logo usa solo le lettere che servono -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&text=Salvaspesa&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <!-- il catalogo parte subito, mentre si scaricano stile e programma -->
  <script>window.__catalogo = fetch('api/catalogo', { cache: 'no-cache' }).catch(function () { return null; }).then(function (r) { if (!r) throw new Error('rete'); return r; });</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="tabbar" class="tabbar" aria-label="Sezioni"></nav>
  <main id="app"><div class="loading"><div class="spinner"></div></div></main>
  <div id="cartbar" class="cartbar" hidden></div>
  <div id="sheet" class="sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
